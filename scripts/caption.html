<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>福宝相册 · 写文案</title>
<style>
  :root { --bg:#241f1a; --fg:#e8e0d0; --dim:#9a8f7d; --accent:#d9a441; --card:#2e2822; --line:#4a4136; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif; }
  header { position:sticky; top:0; z-index:9; background:rgba(36,31,26,.96); border-bottom:1px solid #3a332b; padding:10px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header b { color:var(--accent); font-size:16px; }
  header .hint { color:var(--dim); font-size:12px; }
  #status { font-size:12px; color:#e07b4f; }
  button { background:#3a332b; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 14px; cursor:pointer; }
  button.primary { background:var(--accent); color:#241f1a; border-color:var(--accent); font-weight:600; }
  main { max-width:860px; margin:0 auto; padding:16px 16px 90px; }
  h2.sec { color:var(--accent); font-size:15px; margin:26px 0 10px; border-bottom:1px solid #3a332b; padding-bottom:6px; }
  .mrow { display:flex; gap:12px; align-items:flex-start; background:var(--card); border:1px solid #3a332b; border-radius:8px; padding:10px 12px; margin-bottom:10px; }
  .mrow label { min-width:88px; padding-top:6px; color:var(--accent); font-weight:600; }
  .mrow textarea { flex:1; background:#1b1713; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px; min-height:52px; resize:vertical; font:inherit; }
  .prow { display:flex; gap:12px; align-items:center; background:var(--card); border:1px solid #3a332b; border-radius:8px; padding:8px 12px; margin-bottom:8px; }
  .prow img { width:74px; height:74px; object-fit:cover; border-radius:6px; background:#1b1713; flex:none; }
  .prow .info { width:150px; flex:none; font-size:12px; color:var(--dim); }
  .prow .info .ai { display:block; margin-top:4px; font-style:italic; opacity:.75; }
  .prow .edit { flex:1; display:flex; flex-direction:column; gap:6px; }
  .prow input[type=text] { background:#1b1713; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; }
  .prow .opts { font-size:12px; color:var(--dim); display:flex; gap:14px; }
  .prow .clear { flex:none; font-size:12px; padding:2px 8px; }
  .prow.has { border-color:var(--accent); }
  textarea:focus, input:focus { outline:1px solid var(--accent); }
</style>
</head>
<body>
<header>
  <b>福宝相册 · 写文案</b>
  <span class="hint">只有这里手写的文字会上网站；留空 = 该照片无任何描述。保存后双击「更新相册.bat」生效</span>
  <span id="status"></span>
  <span style="flex:1"></span>
  <button class="primary" id="save">保存</button>
</header>
<main>
  <h2 class="sec">章节引言（写在每个月翻页隔页上）</h2>
  <div id="months"></div>
  <h2 class="sec">照片描述（按时间排列）</h2>
  <div id="photos"></div>
</main>
<script>
let photos = [], dirty = false;
const $ = s => document.querySelector(s);
const idOf = name => name.replace(/\.[^.]+$/, '');
const monthOf = p => (p.date || '').slice(0, 7) || '未知';
const monthLabel = m => { const [y, mo] = m.split('-'); return `${y}年${+mo}月`; };
const cap = {};  // 编辑中的文案：{ months:{}, [id]:{desc,layout} }

function markDirty() { dirty = true; $('#status').textContent = '· 有未保存修改'; }
function markClean(msg) { dirty = false; $('#status').textContent = msg || ''; }

function render() {
  const mEl = $('#months'); mEl.textContent = '';
  const months = [...new Set(photos.map(monthOf))].sort();
  for (const m of months) {
    const row = document.createElement('div'); row.className = 'mrow';
    const lab = document.createElement('label'); lab.textContent = monthLabel(m);
    const ta = document.createElement('textarea');
    ta.placeholder = '这个月的章节引言（可留空）';
    const v = cap.months?.[m]; ta.value = typeof v === 'string' ? v : v?.text ?? '';
    ta.oninput = () => { cap.months ??= {}; cap.months[m] = ta.value; markDirty(); };
    row.append(lab, ta); mEl.append(row);
  }
  const pEl = $('#photos'); pEl.textContent = '';
  for (const p of photos) {
    const id = idOf(p.name);
    const row = document.createElement('div'); row.className = 'prow';
    const img = document.createElement('img'); img.loading = 'lazy'; img.src = '/' + p.thumb; img.alt = id;
    const info = document.createElement('div'); info.className = 'info';
    info.textContent = (p.date || '').slice(0, 16);
    const ai = document.createElement('span'); ai.className = 'ai';
    ai.textContent = 'AI参考（不会上传）：' + (p.desc || '无');
    info.append(ai);
    const edit = document.createElement('div'); edit.className = 'edit';
    const input = document.createElement('input'); input.type = 'text';
    input.placeholder = '给这张照片写一句话（留空则不显示任何文字）';
    input.value = cap[id]?.desc ?? '';
    const hero = document.createElement('input'); hero.type = 'checkbox'; hero.checked = cap[id]?.layout === 'hero';
    const heroLab = document.createElement('label'); heroLab.append(hero, '独占一页');
    const opts = document.createElement('div'); opts.className = 'opts';
    opts.append(heroLab);
    input.oninput = () => {
      cap[id] ??= {};
      if (input.value) cap[id].desc = input.value; else delete cap[id].desc;
      if (!cap[id].desc && !cap[id].layout) delete cap[id];
      sync(row, id); markDirty();
    };
    hero.onchange = () => {
      cap[id] ??= {};
      if (hero.checked) cap[id].layout = 'hero'; else delete cap[id].layout;
      if (!cap[id].desc && !cap[id].layout) delete cap[id];
      sync(row, id); markDirty();
    };
    const clr = document.createElement('button'); clr.className = 'clear'; clr.textContent = '清除';
    clr.onclick = () => { delete cap[id]; input.value = ''; hero.checked = false; sync(row, id); markDirty(); };
    edit.append(input, opts);
    row.append(img, info, edit, clr);
    sync(row, id);
    pEl.append(row);
  }
}
function sync(row, id) { row.classList.toggle('has', !!(cap[id]?.desc || cap[id]?.layout)); }

async function save() {
  const out = {};
  const mo = {}; for (const [m, v] of Object.entries(cap.months ?? {})) { const t = (typeof v === 'string' ? v : v?.text ?? '').trim(); if (t) mo[m] = t; }
  if (Object.keys(mo).length) out.months = mo;
  for (const [k, v] of Object.entries(cap)) {
    if (k === 'months') continue;
    const o = {}; if (v.desc?.trim()) o.desc = v.desc.trim(); if (v.layout === 'hero') o.layout = 'hero';
    if (Object.keys(o).length) out[k] = o;
  }
  const res = await fetch('/save-captions', { method: 'POST', body: JSON.stringify(out) });
  if (!res.ok) { alert('保存失败: ' + await res.text()); return; }
  markClean('已保存 ✓');
}

fetch('/captions-data').then(r => r.json()).then(d => {
  photos = d.photos;
  Object.assign(cap, d.captions ?? {});
  cap.months ??= {};
  render();
  markClean(`共 ${photos.length} 张照片`);
});
$('#save').onclick = save;
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
</html>
