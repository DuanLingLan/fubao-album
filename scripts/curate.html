<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>福宝相册 · 选片</title>
<style>
  :root { --bg:#241f1a; --fg:#e8e0d0; --dim:#9a8f7d; --accent:#d9a441; --card:#2e2822; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif; }
  header { position:sticky; top:0; z-index:9; background:rgba(36,31,26,.96); border-bottom:1px solid #3a332b; padding:10px 16px; }
  .row1 { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .row1 b { color:var(--accent); }
  .row1 input[type=search] { flex:1; min-width:160px; background:#1b1713; color:var(--fg); border:1px solid #4a4136; border-radius:6px; padding:6px 10px; }
  button { background:#3a332b; color:var(--fg); border:1px solid #4a4136; border-radius:6px; padding:6px 12px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#241f1a; border-color:var(--accent); font-weight:600; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .chip { padding:3px 10px; border-radius:999px; background:#332c25; border:1px solid #4a4136; cursor:pointer; font-size:12px; }
  .chip.on { background:var(--accent); color:#241f1a; border-color:var(--accent); }
  main { padding:12px 16px 80px; }
  .mhead { position:sticky; top:96px; z-index:8; display:flex; align-items:center; gap:10px; background:var(--bg); padding:8px 0; margin-top:10px; border-bottom:1px solid #3a332b; }
  .mhead h2 { margin:0; font-size:16px; color:var(--accent); }
  .mhead span { color:var(--dim); font-size:12px; }
  .mhead button { padding:2px 8px; font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; padding:10px 0; }
  .card { position:relative; border-radius:8px; overflow:hidden; background:var(--card); cursor:pointer; border:2px solid transparent; }
  .card img { width:100%; aspect-ratio:226/300; object-fit:cover; display:block; background:#1b1713; }
  .card .d { padding:4px 6px; font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card.on { border-color:var(--accent); }
  .card.on::after { content:"✓"; position:absolute; top:4px; right:6px; width:20px; height:20px; border-radius:50%; background:var(--accent); color:#241f1a; font-weight:700; display:grid; place-items:center; font-size:13px; }
  #dirty { color:#e07b4f; font-size:12px; }
</style>
</head>
<body>
<header>
  <div class="row1">
    <span>猫片 <b id="total">-</b> 张 · 已选 <b id="selcount">0</b> 张 <span id="dirty"></span></span>
    <input type="search" id="q" placeholder="搜索描述 / 标签 / 日期…">
    <button id="invert">反选当前</button>
    <button class="primary" id="save">导出</button>
    <button class="primary" id="saveexit">导出并退出</button>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main id="main"></main>
<script>
let rows = [], selected = new Set(), dirty = false;
let tagFilter = null, query = '';
const $ = s => document.querySelector(s);

function monthOf(r) { return (r.date || '').slice(0, 7); }
function monthLabel(m) { const [y, mo] = m.split('-'); return `${y}年${+mo}月`; }

function matches(r) {
  if (tagFilter && !(r.tags || []).includes(tagFilter)) return false;
  if (query) {
    const hay = `${r.desc || ''} ${(r.tags || []).join(' ')} ${r.date || ''} ${r.name}`.toLowerCase();
    if (!hay.includes(query)) return false;
  }
  return true;
}

function render() {
  const byMonth = new Map();
  for (const r of rows) {
    if (!matches(r)) continue;
    const m = monthOf(r) || '未知';
    if (!byMonth.has(m)) byMonth.set(m, []);
    byMonth.get(m).push(r);
  }
  const frag = document.createDocumentFragment();
  for (const m of [...byMonth.keys()].sort()) {
    const list = byMonth.get(m);
    const head = document.createElement('div');
    head.className = 'mhead';
    const selIn = list.filter(r => selected.has(r.name)).length;
    head.innerHTML = `<h2>${monthLabel(m)}</h2><span>${list.length} 张 · 已选 ${selIn}</span>`;
    const all = document.createElement('button');
    all.textContent = '全选';
    all.onclick = () => { list.forEach(r => selected.add(r.name)); markDirty(); render(); };
    const none = document.createElement('button');
    none.textContent = '清空';
    none.onclick = () => { list.forEach(r => selected.delete(r.name)); markDirty(); render(); };
    head.append(all, none);
    frag.append(head);
    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const r of list) {
      const card = document.createElement('div');
      card.className = 'card' + (selected.has(r.name) ? ' on' : '');
      card.title = `${r.date}\n${r.desc || ''}\n${(r.tags || []).join(' / ')}`;
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.src = '/' + (r.thumb || '');
      img.alt = r.desc || r.name;
      const d = document.createElement('div');
      d.className = 'd';
      d.textContent = `${(r.date || '').slice(5, 10)} ${r.desc || r.name}`;
      card.append(img, d);
      card.onclick = () => {
        if (selected.has(r.name)) selected.delete(r.name); else selected.add(r.name);
        markDirty();
        card.classList.toggle('on');
        updateCount();
        head.querySelector('span').textContent = `${list.length} 张 · 已选 ${list.filter(x => selected.has(x.name)).length}`;
      };
      grid.append(card);
    }
    frag.append(grid);
  }
  const main = $('#main');
  main.textContent = '';
  main.append(frag);
  updateCount();
}

function updateCount() {
  $('#selcount').textContent = selected.size;
  $('#dirty').textContent = dirty ? '· 未导出' : '';
}
function markDirty() { dirty = true; updateCount(); }

async function save(exit) {
  const arr = rows.filter(r => selected.has(r.name)).map(r => r.name).sort();
  const res = await fetch('/save' + (exit ? '?exit=1' : ''), { method: 'POST', body: JSON.stringify(arr) });
  if (!res.ok) { alert('导出失败: ' + await res.text()); return; }
  dirty = false; updateCount();
  if (!exit) alert(`已导出 ${arr.length} 张到 scripts/selection.json`);
  else document.body.innerHTML = '<p style="padding:40px;text-align:center;font-size:18px">已导出 ' + arr.length + ' 张，可以关闭本窗口了。</p>';
}

fetch('/data').then(r => r.json()).then(async d => {
  rows = d.rows;
  selected = new Set(d.selection.map(s => s.replace(/\.[^.]+$/, '')));
  // 清单里可能有个别不在索引中的文件名，保留无碍
  $('#total').textContent = rows.length;
  const tagCount = new Map();
  for (const r of rows) for (const t of r.tags || []) tagCount.set(t, (tagCount.get(t) || 0) + 1);
  const top = [...tagCount.entries()].sort((a, b) => b[1] - a[1]).slice(0, 14);
  const chips = $('#chips');
  const mk = (label, val) => {
    const c = document.createElement('span');
    c.className = 'chip' + (tagFilter === val ? ' on' : '');
    c.textContent = label;
    c.onclick = () => { tagFilter = val; [...chips.children].forEach(x => x.classList.remove('on')); c.classList.add('on'); render(); };
    return c;
  };
  chips.append(mk('全部', null), ...top.map(([t, n]) => mk(`${t} ${n}`, t)));
  render();
});

$('#q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); render(); });
$('#invert').onclick = () => { rows.filter(matches).forEach(r => { if (selected.has(r.name)) selected.delete(r.name); else selected.add(r.name); }); markDirty(); render(); };
$('#save').onclick = () => save(false);
$('#saveexit').onclick = () => save(true);
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
</html>
